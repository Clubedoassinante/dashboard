<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clube do Assinante GZH — Login</title>
<style>
:root {
  --surface-1:      #fcfcfb;
  --page-plane:     #f9f9f7;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --muted:          #898781;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --critical: #d03b3b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --muted:          #898781;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --critical: #e66767;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page-plane);
  color: var(--text-primary);
}
.card {
  width: 100%;
  max-width: 360px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 32px 28px;
  margin: 16px;
}
.card h1 { font-size: 17px; margin: 0 0 4px; }
.card .sub { font-size: 13px; color: var(--text-secondary); margin: 0 0 24px; }
label { display: block; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 6px; }
input {
  width: 100%;
  font-size: 14px;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--page-plane);
  color: var(--text-primary);
  margin-bottom: 16px;
}
button {
  width: 100%;
  font-size: 14px;
  font-weight: 600;
  padding: 11px 12px;
  border-radius: 8px;
  border: none;
  background: var(--series-1);
  color: #fff;
  cursor: pointer;
}
button:disabled { opacity: 0.6; cursor: default; }
.erro {
  font-size: 13px;
  color: var(--critical);
  margin: -8px 0 16px;
  display: none;
}
</style>
</head>
<body>
<div class="card">
  <h1>Clube do Assinante GZH</h1>
  <div class="sub">Painel interno — acesso restrito</div>
  <form id="form-login">
    <label for="email">E-mail</label>
    <input id="email" type="email" required autocomplete="username">
    <label for="senha">Senha</label>
    <input id="senha" type="password" required autocomplete="current-password">
    <div class="erro" id="erro"></div>
    <button type="submit" id="btn-entrar">Entrar</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script>
// Se já tem sessão válida, pula direto pro painel.
supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = 'painel-mensal.html';
});

const form = document.getElementById('form-login');
const erroBox = document.getElementById('erro');
const btn = document.getElementById('btn-entrar');

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  erroBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });

  if (error) {
    erroBox.textContent = 'E-mail ou senha incorretos.';
    erroBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Entrar';
    return;
  }

  window.location.href = 'painel-mensal.html';
});
</script>
</body>
</html>
