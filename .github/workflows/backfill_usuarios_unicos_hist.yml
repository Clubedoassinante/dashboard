name: Backfill de usuários únicos por mês (histórico, 1x só)

# Rodar UMA ÚNICA VEZ, depois de (1) aplicar supabase/008_usuarios_unicos_periodo.sql
# no SQL Editor do Supabase e (2) reenviar ao bucket "uploads-planilhas"
# as planilhas anuais de vouchers (<ano>/vouchers/<ano>.xlsx, 2023-2026)
# -- as mesmas já usadas no backfill histórico original, que precisam
# ser reenviadas porque foram removidas do Storage ao final daquele
# backfill. Não toca carteira_mensal, vouchers_detalhados nem
# resumo_kpis_mensal -- só alimenta a tabela nova
# resumo_cpfs_geradores_mensal, usada pra contar usuários únicos
# deduplicados em qualquer período (ex: um ano inteiro) na aba
# "Acumulado do ano" do painel.
on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite CONFIRMAR para rodar este backfill (reprocessa os 38 meses de voucher já enviados ao Storage)'
        required: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Verificar confirmação
        run: |
          if [ "${{ github.event.inputs.confirmacao }}" != "CONFIRMAR" ]; then
            echo "Confirmação incorreta -- cancelando para evitar rodar por engano."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r etl/requirements.txt

      - name: Rodar backfill de usuários únicos (histórico)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CPF_PEPPER: ${{ secrets.CPF_PEPPER }}
        run: python3 etl/backfill_usuarios_unicos_hist.py
