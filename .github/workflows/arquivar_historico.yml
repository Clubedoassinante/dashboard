name: Arquivar histórico anterior a 2026 (libera espaço no banco)

# Rodar UMA VEZ, depois de aplicar supabase/008_resumo_mensal.sql, para
# transformar os meses de jul/2023-dez/2025 (já carregados pelo
# backfill) em resumo agregado e liberar o espaço que o detalhe cru
# deles ocupava no banco. Idempotente -- pode rodar de novo sem
# problema, meses já arquivados são pulados automaticamente.
on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite CONFIRMAR para apagar o detalhe linha a linha dos meses anteriores a 2026 (os resumos continuam disponíveis no dashboard)'
        required: true

jobs:
  arquivar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Verificar confirmação
        run: |
          if [ "${{ github.event.inputs.confirmacao }}" != "CONFIRMAR" ]; then
            echo "Confirmação incorreta -- cancelando para evitar rodar por engano."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r etl/requirements.txt

      - name: Rodar arquivamento
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 etl/arquivar_historico.py
